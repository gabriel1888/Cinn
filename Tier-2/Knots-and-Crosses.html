<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knots & Crosses - Coffee Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-green: #4a7a5e; --dark-green: #3d6a52; --white: #FFFFFF; --warning-red: #FF6B6B; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        body { font-family: "ITC Franklin Gothic LT", "Oswald", "Franklin Gothic Medium", Arial, sans-serif; background-color: var(--bg-green); color: var(--white); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overscroll-behavior: none; }
        .app-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; min-height: 600px; text-align: center; }
        #play-state, #gate-state, #result-state { display: flex; flex-direction: column; align-items: center; width: 100%; flex-grow: 1; animation: fadeIn 0.4s ease-in-out; }
        #gate-state, #result-state { display: none; justify-content: center; }
        h1 { font-size: 2.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; line-height: 1; }
        .subtitle { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; opacity: 0.8; }
        .game-status { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; margin-bottom: 24px; height: 30px; letter-spacing: 1px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 300px; margin-bottom: 32px; background: var(--dark-green); padding: 8px; border-radius: 12px; }
        .cell { background: var(--bg-green); aspect-ratio: 1 / 1; border: none; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s; position: relative; }
        .cell:active { background: rgba(255,255,255,0.1); }
        .cell img { width: 70%; height: 70%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); animation: popIn 0.2s cubic-bezier(0.25, 1.5, 0.5, 1); }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .legend { display: flex; gap: 20px; margin-bottom: 32px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-item img { width: 24px; height: 24px; object-fit: contain; }
        .gate-title { font-size: 2rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; line-height: 1.1; }
        .gate-subtitle { font-size: 1rem; opacity: 0.8; margin-bottom: 30px; line-height: 1.4; text-transform: uppercase; letter-spacing: 1px; }
        .opt-in-form { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .consent-row { display: flex; align-items: flex-start; gap: 12px; text-align: left; font-size: 0.7rem; line-height: 1.4; color: rgba(255,255,255,0.7); margin-bottom: 4px; text-transform: uppercase; cursor: pointer; }
        .consent-row input[type="checkbox"] { appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 20px; height: 20px; margin-top: 2px; border: 2px solid var(--white); border-radius: 4px; background-color: transparent; cursor: pointer; position: relative; transition: all 0.2s; }
        .consent-row input[type="checkbox"]:checked { background-color: var(--white); border-color: var(--white); }
        .consent-row input[type="checkbox"]:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 6px; height: 11px; border: solid var(--bg-green); border-width: 0 3px 3px 0; transform: rotate(45deg); }
        .consent-row label { cursor: pointer; } .consent-row a { color: var(--white); text-decoration: underline; }
        .email-input { width: 100%; padding: 18px; border: 2px solid var(--white); font-size: 16px; font-family: inherit; color: var(--white); background: transparent; outline: none; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .email-input::placeholder { color: rgba(255,255,255,0.6); }
        .submit-btn { background-color: var(--white); color: var(--bg-green); border: none; padding: 18px; font-size: 1.2rem; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-family: inherit; }
        .result-title { font-size: 2.2rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; line-height: 1; }
        .marketing-text { font-size: 1rem; margin-bottom: 30px; opacity: 0.8; }
        .discount-code { background: rgba(255,255,255,0.1); padding: 30px; margin: 10px 0; border: 2px dashed var(--white); width: 100%; }
        .code-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; opacity: 0.7; }
        .code-text { font-size: 2.5rem; font-weight: 700; letter-spacing: 4px; color: var(--white); word-wrap: break-word; }
        .security-warning { margin-top: 16px; font-size: 0.8rem; font-weight: 700; color: var(--warning-red); text-transform: uppercase; letter-spacing: 1px; }
        .verify-line { margin-top: 12px; font-size: 0.78rem; opacity: 0.7; letter-spacing: 1px; text-transform: lowercase; }
        .verify-line .verify-label { text-transform: uppercase; font-weight: 700; opacity: 0.8; }
        .expiry-badge { margin-top: 8px; font-size: 0.8rem; font-weight: 600; opacity: 0.8; text-transform: uppercase; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(74, 122, 94, 0.3); border-radius: 50%; border-top-color: var(--bg-green); animation: spin 0.8s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } } @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="play-state">
            <h1>KNOTS & CROSSES</h1>
            <div class="subtitle">BEAT THE CAFE TO WIN</div>
            <div class="legend">
                <div class="legend-item"><img src="https://i.ibb.co/TDC1PTNX/pngtree-iced-matcha-latte-in-a-plastic-cup-png-image-16393408.png" referrerPolicy="no-referrer" alt="You" onerror="this.style.display='none'"><span>YOU</span></div>
                <div class="legend-item"><img src="https://i.ibb.co/0yznsCGP/pngtree-cold-brewed-iced-latte-coffee-on-plastic-cup-side-view-generative-png-image-10154258.png" referrerPolicy="no-referrer" alt="Cafe" onerror="this.style.display='none'"><span>CAFE</span></div>
            </div>
            <div class="game-status" id="game-status">YOUR TURN</div>
            <div class="board" id="board"></div>
        </div>
        <div id="gate-state">
            <div class="gate-title" id="gate-title">YOU WIN!</div>
            <div class="gate-subtitle">Enter your email to unlock your 10% off code.</div>
            <form class="opt-in-form" id="email-form">
                <div class="consent-row"><input type="checkbox" id="marketing-consent" name="marketing-consent" required><label for="marketing-consent">I agree to receive promotional emails, offers, and updates from <span id="cafe-name-placeholder">Maple Street Coffee</span>. I can unsubscribe at any time. See our <a href="#" onclick="return false;">Privacy Policy</a>.</label></div>
                <input type="email" class="email-input" id="email" placeholder="YOUR EMAIL" required autocomplete="email">
                <button type="submit" class="submit-btn" id="submit-btn">UNLOCK REWARD</button>
            </form>
        </div>
        <div id="result-state">
            <div class="result-title">REWARD<br>UNLOCKED</div>
            <div class="marketing-text">Enjoy 10% off your next visit!</div>
            <div class="discount-code"><div class="code-label">YOUR 1-USE CODE:</div><div class="code-text" id="final-code">LOADING...</div><div class="expiry-badge" id="expiry-date">Valid for 7 days</div><div class="verify-line"><span class="verify-label">Verify:</span> <span id="verify-email"></span></div></div>
            <div class="security-warning">SINGLE-USE ONLY. BARISTA MUST VERIFY.</div>
        </div>
    </div>
    <script>
        const MAKE_WEBHOOK_URL = 'https://hook.eu2.make.com/wjl53jpu3lwmwaxr5w7hd2fx3bwgmrim';
        const CAFE_NAME = 'Maple Street Coffee';
        const cafeNamePlaceholder = document.getElementById('cafe-name-placeholder');
        if (cafeNamePlaceholder) cafeNamePlaceholder.textContent = CAFE_NAME;
        const HUMAN_IMG = "https://i.ibb.co/TDC1PTNX/pngtree-iced-matcha-latte-in-a-plastic-cup-png-image-16393408.png";
        const CAFE_IMG = "https://i.ibb.co/0yznsCGP/pngtree-cold-brewed-iced-latte-coffee-on-plastic-cup-side-view-generative-png-image-10154258.png";
        const board = document.getElementById('board'); const gameStatus = document.getElementById('game-status');
        let cells = Array(9).fill(null); let gameActive = true; let isHumanTurn = true; let gameOutcome = "";
        const winLines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        function createBoard() { board.innerHTML = ''; cells.forEach((val, index) => { const cell = document.createElement('button'); cell.className = 'cell'; cell.dataset.index = index; cell.addEventListener('click', handleCellClick); board.appendChild(cell); }); }
        function handleCellClick(e) { const index = parseInt(e.target.dataset.index); if (cells[index] !== null || !gameActive || !isHumanTurn) return; placePiece(index, 'human'); if (checkWin()) return; isHumanTurn = false; gameStatus.innerText = "CAFE IS THINKING..."; setTimeout(cafeMove, 800); }
        function placePiece(index, player) { cells[index] = player; const cellEl = board.children[index]; const img = document.createElement('img'); img.src = player === 'human' ? HUMAN_IMG : CAFE_IMG; img.referrerPolicy = "no-referrer"; cellEl.appendChild(img); cellEl.style.pointerEvents = 'none'; }
        function cafeMove() {
            if (!gameActive) return; let move = findBestMove('cafe'); if (move === null) move = findBestMove('human'); if (move === null && cells[4] === null) move = 4;
            if (move === null) { const corners = [0, 2, 6, 8].filter(i => cells[i] === null); if (corners.length > 0) move = corners[Math.floor(Math.random() * corners.length)]; }
            if (move === null) { const empty = cells.map((v, i) => v === null ? i : null).filter(v => v !== null); move = empty[Math.floor(Math.random() * empty.length)]; }
            placePiece(move, 'cafe'); checkWin(); if (gameActive) { isHumanTurn = true; gameStatus.innerText = "YOUR TURN"; }
        }
        function findBestMove(player) { for (let line of winLines) { const [a, b, c] = line; const vals = [cells[a], cells[b], cells[c]]; if (vals.filter(v => v === player).length === 2 && vals.includes(null)) { if (cells[a] === null) return a; if (cells[b] === null) return b; if (cells[c] === null) return c; } } return null; }
        function checkWin() {
            let winner = null; for (let line of winLines) { const [a, b, c] = line; if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) { winner = cells[a]; break; } }
            if (winner) { gameActive = false; if (winner === 'human') { gameStatus.innerText = "YOU WIN!"; gameStatus.style.color = "var(--white)"; gameOutcome = "Win"; } else { gameStatus.innerText = "CAFE WINS!"; gameStatus.style.color = "var(--warning-red)"; gameOutcome = "Loss"; } setTimeout(endGame, 1500); return true; }
            if (!cells.includes(null)) { gameActive = false; gameStatus.innerText = "DRAW!"; gameStatus.style.color = "#ccc"; gameOutcome = "Draw"; setTimeout(endGame, 1500); return true; }
            return false;
        }
        function endGame() { document.getElementById('gate-title').innerText = gameOutcome === "Loss" ? "NICE TRY!" : (gameOutcome === "Draw" ? "IT'S A DRAW!" : "YOU WIN!"); document.getElementById('play-state').style.display = 'none'; document.getElementById('gate-state').style.display = 'flex'; }
        function generateReward() { const prefix = CAFE_NAME.replace(/[^a-zA-Z]/g, '').substring(0, 2).toUpperCase(); const randomNum = Math.floor(1000 + Math.random() * 9000); const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let suffix = ''; for (let i = 0; i < 2; i++) { suffix += chars.charAt(Math.floor(Math.random() * chars.length)); } const finalCode = `${prefix}-${randomNum}-${suffix}`; const today = new Date(); const expireDay = new Date(today); expireDay.setDate(today.getDate() + 7); const options = { month: 'short', day: 'numeric' }; const formattedExpiry = expireDay.toLocaleDateString('en-GB', options); document.getElementById('final-code').innerText = finalCode; document.getElementById('expiry-date').innerText = `Valid for 7 days (Expires ${formattedExpiry})`; }
        document.getElementById('email-form').addEventListener('submit', async (e) => {
            e.preventDefault(); const email = document.getElementById('email').value; const marketingConsent = document.getElementById('marketing-consent').checked; const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerHTML = '<span class="loading-spinner"></span>'; submitBtn.disabled = true; generateReward();
            function maskEmail(em){if(!em||typeof em!=='string')return'';const a=em.indexOf('@');if(a<1)return em;const l=em.slice(0,a),d=em.slice(a);if(l.length<=2)return l+d;return l.slice(0,2)+'•'.repeat(l.length-2)+d;}
            document.getElementById('verify-email').innerText = maskEmail(email);
            const payload = { cafe: CAFE_NAME, email: email, game_result: gameOutcome, marketing_consent: marketingConsent, code: document.getElementById('final-code').innerText, date: new Date().toISOString(), source: "Knots & Crosses Game" };
            try { await fetch(MAKE_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), mode: 'no-cors' }); } catch (error) { console.error('Webhook error:', error); } finally { document.getElementById('gate-state').style.display = 'none'; document.getElementById('result-state').style.display = 'flex'; }
        });
        createBoard();
    </script>
</body>
</html>
